services:
  - type: web
    name: urbaneye-ai
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    disk:
      name: urbaneye-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "1"
      - key: URBANEYE_DATA_DIR
        value: /data
      - key: SESSION_HOURS
        value: "24"
      - key: URBANEYE_ADMIN_INVITE
        sync: false
