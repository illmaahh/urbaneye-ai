services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      COOKIE_SECURE: "1"
      URBANEYE_DATA_DIR: /data
      PUBLIC_ORIGIN: https://${DOMAIN}
    volumes:
      - urbaneye_data:/data
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  urbaneye_data:
  caddy_data:
  caddy_config:
